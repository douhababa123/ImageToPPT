<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>图片转可编辑 PPT</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Image To Editable PPT</p>
        <h1>把图片里的文字变成 PPT 可编辑文本</h1>
        <p class="subtitle">每张图片生成一页幻灯片：先识别中英文文字，再擦除原图文字，最后把可编辑文本框放回原位置。</p>
      </section>

      <section class="card">
        <label class="dropzone" for="files">
          <input id="files" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" multiple />
          <span>选择或拖入图片</span>
          <small>支持 PNG、JPG、WEBP、BMP；上传顺序就是 PPT 页面顺序。</small>
        </label>
        <div id="fileList" class="file-list"></div>
        <button id="convertBtn" type="button">生成 PPT</button>
        <button id="downloadBtn" class="download-btn" type="button" hidden>保存 PPT</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="notes">
        <h2>当前实现</h2>
        <ul>
          <li>OCR：支持在线接口，也保留本地 PaddleOCR 兜底。</li>
          <li>去文字：使用精细文字笔画 mask 擦除原图文字，再叠加可编辑文本框。</li>
          <li>PPT：背景、图标、排版作为图片保留，文字层变成可编辑文本框。</li>
        </ul>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
