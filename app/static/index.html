<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>图片转可编辑 PPT</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Image To Editable PPT</p>
        <h1>把图片文字变成可编辑 PPT</h1>
        <p class="subtitle">上传图片，自动识别中英文文字并擦除，生成可编辑文本框的 PPT 幻灯片。</p>
      </section>

      <section class="card" id="uploadCard">
        <label class="dropzone" for="files">
          <input id="files" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" multiple />
          <span>选择或拖入图片</span>
          <small>支持 PNG、JPG、WEBP、BMP；上传顺序即 PPT 页面顺序</small>
        </label>
        <div id="fileList" class="file-list"></div>
        <button id="convertBtn" type="button">生成 PPT</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="card" id="progressCard" hidden>
        <div class="progress-header">
          <h2>正在处理</h2>
          <p id="progressStage" class="stage-label">准备中...</p>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressFill" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <p id="progressText" class="progress-text">0 / 0</p>
        <div class="stage-indicators">
          <div class="stage" data-stage="OCR">
            <span class="stage-icon">1</span>
            <span>OCR 识别</span>
          </div>
          <div class="stage-divider"></div>
          <div class="stage" data-stage="inpaint">
            <span class="stage-icon">2</span>
            <span>擦除文字</span>
          </div>
          <div class="stage-divider"></div>
          <div class="stage" data-stage="PPTX">
            <span class="stage-icon">3</span>
            <span>生成 PPT</span>
          </div>
        </div>
        <button id="downloadBtn" class="download-btn" type="button" hidden>保存 PPT</button>
        <p id="errorMsg" class="error-msg" hidden></p>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
